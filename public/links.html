    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100dvh;
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background: var(--bg-page);
      background-size: 240% 240%;
      animation: bioGradientShift 15s ease-in-out infinite;
      color: var(--text-main);
      display: flex;
      justify-content: center;
      padding: 20px 16px 48px;
      -webkit-font-smoothing: antialiased;
      position: relative;
      overflow-x: hidden;
    }

    /* ============================================================
       MODULAR LIVING BACKDROP EFFECTS (AURORA, WAVES, STARS, BUBBLES, GRID)
       ============================================================ */
    .bio-bg-stage {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }

    .fx-layer {
      position: absolute;
      inset: 0;
      display: none;
    }

    body[data-bg-effect="aurora"] .fx-aurora,
    body[data-bg-effect="waves"] .fx-waves,
    body[data-bg-effect="stars"] .fx-stars,
    body[data-bg-effect="bubbles"] .fx-bubbles,
    body[data-bg-effect="grid"] .fx-grid {
      display: block;
    }

    /* Shared soft ambient orbs */
    .bio-orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(56px);
      will-change: transform;
      opacity: 0.85;
    }
    .bio-orb-1 { width: 340px; height: 340px; top: -90px; left: -80px; background: var(--orb-1); animation: bioOrbDrift1 14s ease-in-out infinite; }
    .bio-orb-2 { width: 360px; height: 360px; top: 28%; right: -120px; background: var(--orb-2); animation: bioOrbDrift2 18s ease-in-out infinite; }
    .bio-orb-3 { width: 310px; height: 310px; bottom: -90px; left: 12%; background: var(--orb-3); animation: bioOrbDrift3 16s ease-in-out infinite; }

    /* FX 1: Aurora Dot Grid + Orbit */
    .bio-dot-grid {
      position: absolute;
      inset: -40px;
      background-image: radial-gradient(var(--grid-color) 1.5px, transparent 1.5px);
      background-size: 28px 28px;
      animation: bioGridFloat 22s linear infinite;
    }
    .bio-ring-deco {
      position: absolute;
      width: 460px;
      height: 460px;
      top: -160px;
      left: 50%;
      border-radius: 50%;
      border: 1.5px dashed rgba(255, 255, 255, 0.25);
      animation: bioSpinSlow 42s linear infinite;
    }

    /* FX 2: Animated Ocean Waves */
    .bio-wave-svg {
      position: absolute;
      bottom: -8px;
      left: 0;
      width: 200%;
      height: 210px;
      will-change: transform;
    }
    .bio-wave-svg.wave-back {
      fill: var(--wave-2);
      animation: bioWaveSlide 14s linear infinite;
      bottom: 8px;
    }
    .bio-wave-svg.wave-front {
      fill: var(--wave-1);
      animation: bioWaveSlideRev 10s linear infinite;
    }

    /* FX 3: Starfield + Shooting Meteors */
    .bio-star {
      position: absolute;
      border-radius: 50%;
      background: var(--particle-color);
      box-shadow: 0 0 10px var(--particle-glow);
      animation: bioTwinkle var(--dur, 4s) ease-in-out var(--delay, 0s) infinite;
    }
    .bio-meteor {
      position: absolute;
      width: 110px;
      height: 2px;
      border-radius: 999px;
      background: linear-gradient(90deg, var(--particle-color), transparent);
      transform: rotate(-32deg);
      opacity: 0;
      animation: bioMeteorShoot var(--dur, 7s) linear var(--delay, 0s) infinite;
    }

    /* FX 4: Floating Bokeh Bubbles */
    .bio-bubble {
      position: absolute;
      bottom: -60px;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, rgba(255, 255, 255, 0.7), var(--orb-1) 70%);
      border: 1px solid rgba(255, 255, 255, 0.35);
      opacity: 0;
      will-change: transform, opacity;
      animation: bioParticleRise var(--dur, 13s) linear var(--delay, 0s) infinite;
    }

    /* FX 5: Cyber Geometric Grid */
    .bio-cyber-lines {
      position: absolute;
      inset: -60px;
      background-image:
        linear-gradient(to right, var(--grid-color) 1px, transparent 1px),
        linear-gradient(to bottom, var(--grid-color) 1px, transparent 1px);
      background-size: 42px 42px;
      animation: bioGridFloat 18s linear infinite;
    }
    .bio-cyber-pulse {
      position: absolute;
      width: 340px;
      height: 340px;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      border-radius: 50%;
      border: 1.5px solid var(--grid-color);
      animation: bioRingExpand 8s ease-out infinite;
    }
    .bio-cyber-pulse.p2 { animation-delay: -4s; }

    /* Subtle rising sparks shared across light effects */
    .bio-particle {
      position: absolute;
      bottom: -24px;
      border-radius: 50%;
      background: var(--particle-color);
      box-shadow: 0 0 12px var(--particle-glow);
      opacity: 0;
      will-change: transform, opacity;
      animation: bioParticleRise var(--dur, 11s) linear var(--delay, 0s) infinite;
    }

    @keyframes bioGradientShift { 0%, 100% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } }
    @keyframes bioGridFloat { 0% { transform: translate3d(0, 0, 0); } 100% { transform: translate3d(42px, 42px, 0); } }
    @keyframes bioOrbDrift1 { 0%, 100% { transform: translate3d(0, 0, 0) scale(1); } 33% { transform: translate3d(60px, 45px, 0) scale(1.12); } 66% { transform: translate3d(20px, 90px, 0) scale(0.94); } }
    @keyframes bioOrbDrift2 { 0%, 100% { transform: translate3d(0, 0, 0) scale(1); } 40% { transform: translate3d(-75px, -50px, 0) scale(1.14); } 75% { transform: translate3d(-35px, 65px, 0) scale(0.92); } }
    @keyframes bioOrbDrift3 { 0%, 100% { transform: translate3d(0, 0, 0) scale(1); } 50% { transform: translate3d(70px, -60px, 0) scale(1.15); } }
    @keyframes bioSpinSlow { from { transform: translateX(-50%) rotate(0deg); } to { transform: translateX(-50%) rotate(360deg); } }
    @keyframes bioAvatarHalo { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    @keyframes bioWaveSlide { from { transform: translateX(0); } to { transform: translateX(-50%); } }
    @keyframes bioWaveSlideRev { from { transform: translateX(-50%); } to { transform: translateX(0); } }
    @keyframes bioTwinkle { 0%, 100% { opacity: 0.25; transform: scale(0.85); } 50% { opacity: 0.95; transform: scale(1.25); } }
    @keyframes bioMeteorShoot {
      0% { transform: translate3d(0, 0, 0) rotate(-32deg); opacity: 0; }
      6% { opacity: 0.95; }
      24% { transform: translate3d(-360px, 230px, 0) rotate(-32deg); opacity: 0; }
      100% { transform: translate3d(-360px, 230px, 0) rotate(-32deg); opacity: 0; }
    }
    @keyframes bioRingExpand {
      0% { transform: translate(-50%, -50%) scale(0.45); opacity: 0.65; }
      100% { transform: translate(-50%, -50%) scale(2.1); opacity: 0; }
    }
    @keyframes bioParticleRise {
      0% { transform: translate3d(0, 0, 0) scale(0.65); opacity: 0; }
      12% { opacity: 0.72; }
      85% { opacity: 0.52; }
      100% { transform: translate3d(var(--drift, 24px), -108vh, 0) scale(1.15); opacity: 0; }
    }
    @keyframes bioCardEnter {
      from { opacity: 0; transform: translateY(14px) scale(0.985); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    /* ============================================================
       MAIN CONTENT SHELL & CARD STYLE VARIANTS
       ============================================================ */
    .bio-shell {
      position: relative;
      z-index: 2;
      width: 100%;
      max-width: 500px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .bio-topbar {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 18px;
      gap: 10px;
    }

    .bio-top-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 14px;
      border-radius: 999px;
      background: var(--pill-bg);
      border: 1px solid var(--pill-border);
      color: var(--header-text);
      text-decoration: none;
      font-size: 0.78rem;
      font-weight: 700;
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      box-shadow: 0 4px 14px rgba(15, 23, 42, 0.08);
      cursor: pointer;
      transition: transform 0.18s ease, box-shadow 0.18s ease;
    }

    .bio-top-pill:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(15, 23, 42, 0.14);
    }

    .bio-profile {
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: 24px;
      width: 100%;
    }

    .bio-avatar-wrap {
      width: 98px;
      height: 98px;
      border-radius: 50%;
      padding: 4px;
      position: relative;
      margin-bottom: 14px;
      box-shadow: 0 14px 30px -8px var(--avatar-ring);
    }

    .bio-avatar-wrap::before {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: 50%;
      background: conic-gradient(from 0deg, var(--accent), var(--accent-2), #ec4899, #06b6d4, var(--accent));
      animation: bioAvatarHalo 7s linear infinite;
    }

    .bio-avatar-inner {
      position: relative;
      z-index: 1;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      color: var(--accent);

  <script>
    (function () {
      const ICON_MAP = {
        briefcase: 'fa-solid fa-briefcase',
        globe: 'fa-solid fa-globe',
        whatsapp: 'fa-brands fa-whatsapp',
        'file-cv': 'fa-solid fa-file-lines',
        instagram: 'fa-brands fa-instagram',
        tiktok: 'fa-brands fa-tiktok',
        telegram: 'fa-brands fa-telegram',
        envelope: 'fa-solid fa-envelope',
        link: 'fa-solid fa-link'
      };

      const THEME_DEFAULT_EFFECT = {
        clean: 'aurora',
        ocean: 'waves',
        emerald: 'grid',
        sunset: 'bubbles',
        midnight: 'stars',
        royal: 'stars',
        sakura: 'bubbles',
        cyberpunk: 'grid',
        custom: 'aurora'
      };

      const yearEl = document.getElementById('bio-year');
      if (yearEl) yearEl.textContent = String(new Date().getFullYear());

      function esc(str) {
        return String(str || '')
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#39;');
      }

      function hexToRgb(hex) {
        const clean = String(hex || '').replace('#', '');
        if (clean.length !== 6) return { r: 37, g: 99, b: 235 };
        return {
          r: parseInt(clean.slice(0, 2), 16) || 0,
          g: parseInt(clean.slice(2, 4), 16) || 0,
          b: parseInt(clean.slice(4, 6), 16) || 0
        };
      }

      function hexLuminance(hex) {
        const { r, g, b } = hexToRgb(hex);
        return (0.299 * r + 0.587 * g + 0.114 * b) / 255;
      }

      function hexRgba(hex, alpha) {
        const { r, g, b } = hexToRgb(hex);
        return `rgba(${r}, ${g}, ${b}, ${alpha})`;
      }

      function getDomainLabel(url) {
        try {
          const u = new URL(url, window.location.origin);
          return u.hostname.replace(/^www\./, '');
        } catch {
          return String(url || '').replace(/^https?:\/\//i, '').split('/')[0] || '';
        }
      }

      function showToast(msg) {
        const el = document.getElementById('bio-toast');
        if (!el) return;
        el.textContent = msg;
        el.classList.add('show');
        clearTimeout(el._t);
        el._t = setTimeout(() => el.classList.remove('show'), 2200);
      }

      function trackClick(linkId) {
        if (!linkId) return;
        const endpoint = `/api/bio-links/${encodeURIComponent(linkId)}/click`;
        try {
          if (navigator.sendBeacon) {
            navigator.sendBeacon(endpoint, new Blob(['{}'], { type: 'application/json' }));
            return;
          }
        } catch (e) {}
        fetch(endpoint, { method: 'POST', keepalive: true }).catch(() => {});
      }

      function applyThemeAndEffects(profile) {
        const theme = profile.theme || 'clean';
        const rawEffect = profile.bg_effect || 'auto';
        const resolvedEffect = (rawEffect === 'auto' || !rawEffect)
          ? (THEME_DEFAULT_EFFECT[theme] || 'aurora')
          : rawEffect;
        const cardStyle = profile.card_style || 'glass';

        document.body.setAttribute('data-bio-theme', theme);
        document.body.setAttribute('data-bg-effect', resolvedEffect);
        document.body.setAttribute('data-card-style', cardStyle);

        if (theme === 'custom') {
          const c1 = /^#[0-9a-fA-F]{6}$/.test(profile.custom_c1 || '') ? profile.custom_c1 : '#2563eb';
          const c2 = /^#[0-9a-fA-F]{6}$/.test(profile.custom_c2 || '') ? profile.custom_c2 : '#7c3aed';
          const c3 = /^#[0-9a-fA-F]{6}$/.test(profile.custom_c3 || '') ? profile.custom_c3 : '#06b6d4';
          const avgLum = (hexLuminance(c1) + hexLuminance(c2) + hexLuminance(c3)) / 3;
          const mode = profile.custom_text_mode && profile.custom_text_mode !== 'auto'
            ? profile.custom_text_mode
            : (avgLum < 0.56 ? 'light' : 'dark');
          document.body.setAttribute('data-text-mode', mode);
          document.body.style.setProperty('--bg-page', `linear-gradient(125deg, ${c1} 0%, ${c2} 50%, ${c3} 100%)`);
          document.body.style.setProperty('--orb-1', hexRgba(c1, 0.5));
          document.body.style.setProperty('--orb-2', hexRgba(c2, 0.5));
          document.body.style.setProperty('--orb-3', hexRgba(c3, 0.45));
          document.body.style.setProperty('--accent', c1);
          document.body.style.setProperty('--accent-2', c2);
          document.body.style.setProperty('--accent-soft', hexRgba(c1, 0.14));
          document.body.style.setProperty('--wave-1', mode === 'light' ? 'rgba(255,255,255,0.16)' : hexRgba(c1, 0.16));
          document.body.style.setProperty('--wave-2', mode === 'light' ? 'rgba(255,255,255,0.12)' : hexRgba(c2, 0.14));
        } else {
          document.body.removeAttribute('data-text-mode');
          ['--bg-page', '--orb-1', '--orb-2', '--orb-3', '--accent', '--accent-2', '--accent-soft', '--wave-1', '--wave-2'].forEach(v => {
            document.body.style.removeProperty(v);
          });
        }
      }

      function renderBioPage(data) {
        const profile = (data && data.profile) || {};
        const links = Array.isArray(data && data.links) ? data.links.filter(l => l && l.active !== false && l.url) : [];

        applyThemeAndEffects(profile);

        if (profile.name) {
          document.title = `${profile.name} · Link Resmi`;
          document.getElementById('bio-name').textContent = profile.name;
        }
        document.getElementById('bio-subtitle').textContent = profile.subtitle || '';

        const badgeEl = document.getElementById('bio-badge');
        if (badgeEl) {
          if (profile.badge) {
            badgeEl.innerHTML = `<i class="fa-solid fa-shield-check"></i> ${esc(profile.badge)}`;
            badgeEl.style.display = 'inline-flex';
          } else {
            badgeEl.style.display = 'none';
          }
        }

        const avatarEl = document.getElementById('bio-avatar');
        if (avatarEl) {
          if (profile.avatar) {
            avatarEl.innerHTML = `<img src="${esc(profile.avatar)}" alt="${esc(profile.name || 'Profil')}">`;
          } else {
            avatarEl.innerHTML = '<i class="fa-solid fa-briefcase"></i>';
          }
        }

        const listEl = document.getElementById('bio-links-list');
        if (!links.length) {
          listEl.innerHTML = '<div style="text-align:center;color:var(--header-sub);padding:24px;font-size:0.88rem;">Belum ada tautan aktif.</div>';
        } else {
          listEl.innerHTML = links.map((item, idx) => {
            const iconKey = ICON_MAP[item.icon] ? item.icon : 'link';
            const thumbHtml = item.thumbnail
              ? `<img src="${esc(item.thumbnail)}" alt="${esc(item.title)}" loading="eager" decoding="async">`
              : `<i class="${ICON_MAP[iconKey]}"></i>`;
            const domain = getDomainLabel(item.url);
            const subText = item.subtitle ? item.subtitle : domain;
            return `
              <a class="bio-link-card" style="--card-idx: ${idx};" href="${esc(item.url)}" target="_blank" rel="noopener noreferrer" data-link-id="${esc(item.id)}">
                <div class="bio-link-thumb tone-${esc(iconKey)}">${thumbHtml}</div>
                <div class="bio-link-body">
                  <div class="bio-link-title-row">
                    <span class="bio-link-title">${esc(item.title)}</span>
                    ${item.badge ? `<span class="bio-link-badge">${esc(item.badge)}</span>` : ''}
                  </div>
                  <div class="bio-link-sub">${esc(subText)}</div>
                </div>
                <div class="bio-link-arrow"><i class="fa-solid fa-chevron-right"></i></div>
              </a>
            `;
          }).join('');

          listEl.querySelectorAll('.bio-link-card').forEach(card => {
            card.addEventListener('click', () => {
              trackClick(card.getAttribute('data-link-id'));
            });
          });
        }

        const socialsEl = document.getElementById('bio-socials');
        const socialItems = [];
        if (profile.instagram_url) {
          const igUrl = /^https?:\/\//i.test(profile.instagram_url) ? profile.instagram_url : `https://${profile.instagram_url}`;
          socialItems.push(`<a class="bio-social-btn ig" href="${esc(igUrl)}" target="_blank" rel="noopener noreferrer"><i class="fa-brands fa-instagram"></i> Instagram</a>`);
        }
        if (profile.tiktok_url) {
          const ttUrl = /^https?:\/\//i.test(profile.tiktok_url) ? profile.tiktok_url : `https://${profile.tiktok_url}`;
          socialItems.push(`<a class="bio-social-btn tt" href="${esc(ttUrl)}" target="_blank" rel="noopener noreferrer"><i class="fa-brands fa-tiktok"></i> TikTok</a>`);
        }
        if (socialItems.length > 0) {
          socialsEl.innerHTML = socialItems.join('');
          socialsEl.style.display = 'flex';
        } else {
          socialsEl.style.display = 'none';
        }
      }

      const shareBtn = document.getElementById('btn-share-bio');
      if (shareBtn) {
        shareBtn.addEventListener('click', async () => {
          const url = window.location.href;
          if (navigator.share) {
            try {
              await navigator.share({ title: document.title, url });
              return;
            } catch (e) {}
          }
          if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(url).then(() => showToast('Link Bio berhasil disalin!'));
          } else {
            showToast(url);
          }
        });
      }

      fetch('/api/bio-links')
        .then(r => r.json())
        .then(res => {
          renderBioPage((res && res.data) || res || {});
        })
        .catch(() => {
          renderBioPage({
            profile: {
              name: 'KitaKerja · LOKERSMASMK',
              subtitle: 'Portal Lowongan Kerja Resmi Terverifikasi'
            },
            links: [
              { id: 'fallback_1', title: 'Web Kita LOKERSMASMK', subtitle: 'kitakerja.biz.id', url: '/', icon: 'globe', active: true }
            ]
          });
        });
    })();
  </script>
</body>

</html>

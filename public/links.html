    * {

      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100dvh;
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background: var(--bg-page);
      background-size: 240% 240%;
      animation: bioGradientShift 16s ease-in-out infinite;
      color: var(--text-main);
      display: flex;
      justify-content: center;
      padding: 20px 16px 48px;
      -webkit-font-smoothing: antialiased;
      position: relative;
      overflow-x: hidden;
    }

    /* ============================================================
       LIVING ANIMATED BACKDROP (AURORA ORBS + GRID + FLOATING SPARKS)
       ============================================================ */
    .bio-bg-stage {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }

    .bio-bg-grid {
      position: absolute;
      inset: -40px;
      background-image:
        radial-gradient(var(--grid-color) 1.5px, transparent 1.5px);
      background-size: 28px 28px;
      animation: bioGridFloat 22s linear infinite;
      opacity: 0.9;
    }

    .bio-orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(56px);
      will-change: transform;
      opacity: 0.85;
    }

    .bio-orb-1 {
      width: 340px;
      height: 340px;
      top: -90px;
      left: -80px;
      background: var(--orb-1);
      animation: bioOrbDrift1 14s ease-in-out infinite;
    }

    .bio-orb-2 {
      width: 360px;
      height: 360px;
      top: 28%;
      right: -120px;
      background: var(--orb-2);
      animation: bioOrbDrift2 18s ease-in-out infinite;
    }

    .bio-orb-3 {
      width: 310px;
      height: 310px;
      bottom: -90px;
      left: 12%;
      background: var(--orb-3);
      animation: bioOrbDrift3 16s ease-in-out infinite;
    }

    .bio-particles {
      position: absolute;
      inset: 0;
    }

    .bio-particle {
      position: absolute;
      bottom: -24px;
      border-radius: 50%;
      background: var(--particle-color);
      box-shadow: 0 0 14px var(--particle-glow);
      opacity: 0;
      will-change: transform, opacity;
      animation: bioParticleRise var(--dur, 11s) linear var(--delay, 0s) infinite;
    }

    .bio-ring-deco {
      position: absolute;
      width: 460px;
      height: 460px;
      top: -160px;
      left: 50%;
      transform: translateX(-50%);
      border-radius: 50%;
      border: 1.5px dashed rgba(255, 255, 255, 0.22);
      animation: bioSpinSlow 46s linear infinite;
    }

    @keyframes bioGradientShift {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    @keyframes bioGridFloat {
      0% { transform: translate3d(0, 0, 0); }
      100% { transform: translate3d(28px, 28px, 0); }
    }

    @keyframes bioOrbDrift1 {
      0%, 100% { transform: translate3d(0, 0, 0) scale(1); }
      33% { transform: translate3d(60px, 45px, 0) scale(1.12); }
      66% { transform: translate3d(20px, 90px, 0) scale(0.94); }
    }

    @keyframes bioOrbDrift2 {
      0%, 100% { transform: translate3d(0, 0, 0) scale(1); }
      40% { transform: translate3d(-75px, -50px, 0) scale(1.14); }
      75% { transform: translate3d(-35px, 65px, 0) scale(0.92); }
    }

    @keyframes bioOrbDrift3 {
      0%, 100% { transform: translate3d(0, 0, 0) scale(1); }
      50% { transform: translate3d(70px, -60px, 0) scale(1.15); }
    }

    @keyframes bioParticleRise {
      0% {
        transform: translate3d(0, 0, 0) scale(0.6);
        opacity: 0;
      }
      12% {
        opacity: 0.72;
      }
      85% {
        opacity: 0.55;
      }
      100% {
        transform: translate3d(var(--drift, 28px), -108vh, 0) scale(1.15);
        opacity: 0;
      }
    }

    @keyframes bioSpinSlow {
      from { transform: translateX(-50%) rotate(0deg); }
      to { transform: translateX(-50%) rotate(360deg); }
    }

    @keyframes bioAvatarHalo {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    @keyframes bioCardEnter {
      from {
        opacity: 0;
        transform: translateY(14px) scale(0.985);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    /* ============================================================
       CONTENT SHELL
       ============================================================ */
    .bio-shell {
      position: relative;
      z-index: 2;
      width: 100%;
      max-width: 500px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .bio-topbar {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 18px;
      gap: 10px;
    }

    .bio-top-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 14px;
      border-radius: 999px;
      background: var(--pill-bg);
      border: 1px solid var(--card-border);
      color: var(--text-main);
      text-decoration: none;
      font-size: 0.78rem;
      font-weight: 700;
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      box-shadow: 0 4px 14px rgba(15, 23, 42, 0.08);
      cursor: pointer;
      transition: transform 0.18s ease, box-shadow 0.18s ease;
    }

    .bio-top-pill:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(15, 23, 42, 0.14);
    }

    .bio-profile {
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: 24px;
      width: 100%;
    }

    .bio-avatar-wrap {
      width: 98px;
      height: 98px;
      border-radius: 50%;
      padding: 4px;
      position: relative;
      margin-bottom: 14px;
      box-shadow: 0 14px 30px -8px var(--avatar-ring);
    }

    .bio-avatar-wrap::before {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: 50%;
      background: conic-gradient(from 0deg, var(--accent), var(--accent-2), #ec4899, #06b6d4, var(--accent));
      animation: bioAvatarHalo 7s linear infinite;
    }

    .bio-avatar-inner {
      position: relative;
      z-index: 1;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background: #ffffff;
      display: flex;

      overflow: hidden;
      color: var(--accent);
      font-size: 2.1rem;
      border: 3px solid rgba(255, 255, 255, 0.95);

    .bio-avatar-inner img {

      height: 100%;

    .bio-name-row {

    .bio-badge-tag {
      margin-top: 7px;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 4px 12px;

    }

    .bio-subtitle {
      margin-top: 9px;
      font-size: 0.87rem;
      line-height: 1.5;
      color: var(--text-muted);
      max-width: 410px;
      font-weight: 500;
    }

    .bio-links-list {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 13px;
    }

    .bio-link-card {
      display: flex;
      align-items: center;
      gap: 14px;
      width: 100%;
      padding: 12px 16px 12px 12px;
      border-radius: 22px;
      background: var(--card-bg);
      border: 1.5px solid var(--card-border);
      box-shadow: var(--card-shadow);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      text-decoration: none;
      color: var(--text-main);
      transition: transform 0.22s cubic-bezier(0.22, 1, 0.36, 1), box-shadow 0.22s ease, border-color 0.22s ease;
      position: relative;
      overflow: hidden;
      animation: bioCardEnter 0.45s cubic-bezier(0.22, 1, 0.36, 1) both;
      animation-delay: calc(var(--card-idx, 0) * 65ms);
    }

    .bio-link-card::after {
      content: '';
      position: absolute;
      top: 0;
      left: -110%;
      width: 60%;
      height: 100%;
      background: linear-gradient(105deg, transparent 20%, rgba(255, 255, 255, 0.45) 50%, transparent 80%);
      transition: left 0.55s ease;
      pointer-events: none;
    }

    .bio-link-card:hover::after {
      left: 135%;
    }

    .bio-link-card:hover {
      transform: translateY(-3px) scale(1.01);
      box-shadow: var(--card-hover-shadow);
      border-color: var(--accent);
    }

    .bio-link-card:active {
      transform: scale(0.985);
    }

    .bio-link-thumb {
      width: 54px;
      height: 54px;
      border-radius: 16px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.35rem;
      overflow: hidden;
      border: 1px solid rgba(15, 23, 42, 0.06);
      background: #f1f5f9;
      color: #2563eb;
      box-shadow: 0 4px 12px rgba(15, 23, 42, 0.06);
    }

    .bio-link-thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;

    .bio-link-thumb.tone-briefcase { background: linear-gradient(135deg, #fff7ed, #fed7aa); color: #ea580c; }

    .bio-link-thumb.tone-tiktok { background: linear-gradient(135deg, #f1f5f9, #cbd5e1); color: #0f172a; }
    .bio-link-thumb.tone-telegram { background: linear-gradient(135deg, #f0f9ff, #bae6fd); color: #0284c7; }

    }

    .bio-social-btn.ig i { color: #e1306c; }
    .bio-social-btn.tt i { color: var(--text-main); }

    .bio-footer {
      margin-top: 34px;
      text-align: center;
      font-size: 0.76rem;
      color: var(--text-muted);
      font-weight: 500;
    }

    .bio-footer strong {
      color: var(--text-main);
    }

    .bio-skeleton {
      height: 78px;
      border-radius: 22px;
      background: rgba(255, 255, 255, 0.32);
      backdrop-filter: blur(8px);
      width: 100%;
    }

    .bio-toast {
      position: fixed;
      bottom: 22px;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: #0f172a;
      color: #ffffff;
      padding: 10px 18px;
      border-radius: 999px;
      font-size: 0.82rem;
      font-weight: 600;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease, transform 0.2s ease;
      z-index: 999;
      box-shadow: 0 10px 25px rgba(15, 23, 42, 0.25);
    }

    .bio-toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    @media (max-width: 420px) {
      body { padding: 14px 12px 36px; }
      .bio-link-card { padding: 10px 12px 10px 10px; gap: 11px; border-radius: 18px; }
      .bio-link-thumb { width: 48px; height: 48px; border-radius: 14px; font-size: 1.2rem; }
      .bio-link-title { font-size: 0.9rem; }
    }

    @media (prefers-reduced-motion: reduce) {
      body, .bio-bg-grid, .bio-orb, .bio-particle, .bio-ring-deco, .bio-avatar-wrap::before, .bio-link-card {
        animation: none !important;
      }
    }
  </style>
</head>

<body data-bio-theme="clean">
  <!-- Living Animated Gradient & Particle Backdrop -->
  <div class="bio-bg-stage" aria-hidden="true">
    <div class="bio-bg-grid"></div>
    <div class="bio-ring-deco"></div>
    <div class="bio-orb bio-orb-1"></div>
    <div class="bio-orb bio-orb-2"></div>
    <div class="bio-orb bio-orb-3"></div>
    <div class="bio-particles">
      <span class="bio-particle" style="left:8%;  width:8px;  height:8px;  --dur:11s; --delay:0s;    --drift:24px;"></span>
      <span class="bio-particle" style="left:19%; width:12px; height:12px; --dur:14s; --delay:-3s;   --drift:-22px;"></span>
      <span class="bio-particle" style="left:31%; width:7px;  height:7px;  --dur:10s; --delay:-6s;   --drift:18px;"></span>
      <span class="bio-particle" style="left:44%; width:10px; height:10px; --dur:13s; --delay:-2s;   --drift:-28px;"></span>
      <span class="bio-particle" style="left:57%; width:14px; height:14px; --dur:16s; --delay:-8s;   --drift:32px;"></span>
      <span class="bio-particle" style="left:68%; width:8px;  height:8px;  --dur:11s; --delay:-4.5s; --drift:-18px;"></span>
      <span class="bio-particle" style="left:79%; width:11px; height:11px; --dur:15s; --delay:-9.5s; --drift:20px;"></span>
      <span class="bio-particle" style="left:89%; width:9px;  height:9px;  --dur:12s; --delay:-1.5s; --drift:-26px;"></span>
      <span class="bio-particle" style="left:24%; width:6px;  height:6px;  --dur:9.5s; --delay:-7s;  --drift:14px;"></span>
      <span class="bio-particle" style="left:74%; width:7px;  height:7px;  --dur:12.5s; --delay:-5s; --drift:-16px;"></span>
    </div>
  </div>

  <main class="bio-shell">
    <div class="bio-topbar">
      <a href="/" class="bio-top-pill" title="Buka Portal Lowongan Kerja">
        <i class="fa-solid fa-briefcase" style="color: var(--accent);"></i>
        <span>Portal Loker</span>
      </a>
      <button type="button" class="bio-top-pill" id="btn-share-bio" title="Bagikan halaman Link Bio">
        <i class="fa-solid fa-share-nodes"></i>
        <span>Bagikan</span>
      </button>
    </div>

    <header class="bio-profile">
      <div class="bio-avatar-wrap">
        <div class="bio-avatar-inner" id="bio-avatar">
          <i class="fa-solid fa-briefcase"></i>
        </div>
      </div>
      <div class="bio-name-row">
        <h1 class="bio-name" id="bio-name">KitaKerja · LOKERSMASMK</h1>
        <span class="bio-verified" title="Akun Resmi Terverifikasi"><i class="fa-solid fa-check"></i></span>
      </div>
      <div class="bio-badge-tag" id="bio-badge" style="display: none;"></div>
      <p class="bio-subtitle" id="bio-subtitle">Portal Lowongan Kerja Resmi Terverifikasi, Grup Loker Aktif &amp; Layanan CV ATS</p>
    </header>

    <section class="bio-links-list" id="bio-links-list" aria-label="Daftar Tautan Utama">
      <div class="bio-skeleton"></div>
      <div class="bio-skeleton"></div>
      <div class="bio-skeleton"></div>
      <div class="bio-skeleton"></div>
    </section>

    <div class="bio-socials" id="bio-socials" style="display: none;"></div>

    <footer class="bio-footer">
      <div>&copy; <span id="bio-year">2026</span> <strong>KitaKerja</strong> &middot; by <strong>daysheet.id</strong></div>
    </footer>
  </main>

  <div class="bio-toast" id="bio-toast">Tautan disalin!</div>

  <script>
    (function () {
      const ICON_MAP = {
        briefcase: 'fa-solid fa-briefcase',
        globe: 'fa-solid fa-globe',
        whatsapp: 'fa-brands fa-whatsapp',
        'file-cv': 'fa-solid fa-file-lines',
        instagram: 'fa-brands fa-instagram',
        tiktok: 'fa-brands fa-tiktok',
        telegram: 'fa-brands fa-telegram',
        envelope: 'fa-solid fa-envelope',
        link: 'fa-solid fa-link'
      };

      const yearEl = document.getElementById('bio-year');
      if (yearEl) yearEl.textContent = String(new Date().getFullYear());

      function esc(str) {
        return String(str || '')
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#39;');
      }

      function getDomainLabel(url) {
        try {
          const u = new URL(url, window.location.origin);
          return u.hostname.replace(/^www\./, '');
        } catch {
          return String(url || '').replace(/^https?:\/\//i, '').split('/')[0] || '';
        }
      }

      function showToast(msg) {
        const el = document.getElementById('bio-toast');
        if (!el) return;
        el.textContent = msg;
        el.classList.add('show');
        clearTimeout(el._t);
        el._t = setTimeout(() => el.classList.remove('show'), 2200);
      }

      function trackClick(linkId) {
        if (!linkId) return;
        const endpoint = `/api/bio-links/${encodeURIComponent(linkId)}/click`;
        try {
          if (navigator.sendBeacon) {
            navigator.sendBeacon(endpoint, new Blob(['{}'], { type: 'application/json' }));
            return;
          }
        } catch (e) {}
        fetch(endpoint, { method: 'POST', keepalive: true }).catch(() => {});
      }

      function renderBioPage(data) {
        const profile = (data && data.profile) || {};
        const links = Array.isArray(data && data.links) ? data.links.filter(l => l && l.active !== false && l.url) : [];

        document.body.setAttribute('data-bio-theme', profile.theme || 'clean');
        if (profile.name) {
          document.title = `${profile.name} · Link Resmi`;
          document.getElementById('bio-name').textContent = profile.name;
        }
        document.getElementById('bio-subtitle').textContent = profile.subtitle || '';

        const badgeEl = document.getElementById('bio-badge');
        if (badgeEl) {
          if (profile.badge) {
            badgeEl.innerHTML = `<i class="fa-solid fa-shield-check"></i> ${esc(profile.badge)}`;
            badgeEl.style.display = 'inline-flex';
          } else {
            badgeEl.style.display = 'none';
          }
        }

        const avatarEl = document.getElementById('bio-avatar');
        if (avatarEl) {
          if (profile.avatar) {
            avatarEl.innerHTML = `<img src="${esc(profile.avatar)}" alt="${esc(profile.name || 'Profil')}">`;
          } else {
            avatarEl.innerHTML = '<i class="fa-solid fa-briefcase"></i>';
          }
        }

        const listEl = document.getElementById('bio-links-list');
        if (!links.length) {
          listEl.innerHTML = '<div style="text-align:center;color:var(--text-muted);padding:24px;font-size:0.88rem;">Belum ada tautan aktif.</div>';
        } else {
          listEl.innerHTML = links.map((item, idx) => {
            const iconKey = ICON_MAP[item.icon] ? item.icon : 'link';
            const thumbHtml = item.thumbnail
              ? `<img src="${esc(item.thumbnail)}" alt="${esc(item.title)}" loading="eager" decoding="async">`
              : `<i class="${ICON_MAP[iconKey]}"></i>`;
            const domain = getDomainLabel(item.url);
            const subText = item.subtitle ? item.subtitle : domain;
            return `
              <a class="bio-link-card" style="--card-idx: ${idx};" href="${esc(item.url)}" target="_blank" rel="noopener noreferrer" data-link-id="${esc(item.id)}">
                <div class="bio-link-thumb tone-${esc(iconKey)}">${thumbHtml}</div>
                <div class="bio-link-body">
                  <div class="bio-link-title-row">
                    <span class="bio-link-title">${esc(item.title)}</span>
                    ${item.badge ? `<span class="bio-link-badge">${esc(item.badge)}</span>` : ''}
                  </div>
                  <div class="bio-link-sub">${esc(subText)}</div>
                </div>
                <div class="bio-link-arrow"><i class="fa-solid fa-chevron-right"></i></div>
              </a>
            `;
          }).join('');

          listEl.querySelectorAll('.bio-link-card').forEach(card => {
            card.addEventListener('click', () => {
              trackClick(card.getAttribute('data-link-id'));
            });
          });
        }

        const socialsEl = document.getElementById('bio-socials');
        const socialItems = [];
        if (profile.instagram_url) {
          const igUrl = /^https?:\/\//i.test(profile.instagram_url) ? profile.instagram_url : `https://${profile.instagram_url}`;
          socialItems.push(`<a class="bio-social-btn ig" href="${esc(igUrl)}" target="_blank" rel="noopener noreferrer"><i class="fa-brands fa-instagram"></i> Instagram</a>`);
        }
        if (profile.tiktok_url) {
          const ttUrl = /^https?:\/\//i.test(profile.tiktok_url) ? profile.tiktok_url : `https://${profile.tiktok_url}`;
          socialItems.push(`<a class="bio-social-btn tt" href="${esc(ttUrl)}" target="_blank" rel="noopener noreferrer"><i class="fa-brands fa-tiktok"></i> TikTok</a>`);
        }
        if (socialItems.length > 0) {
          socialsEl.innerHTML = socialItems.join('');
          socialsEl.style.display = 'flex';
        } else {
          socialsEl.style.display = 'none';
        }
      }

      const shareBtn = document.getElementById('btn-share-bio');
      if (shareBtn) {
        shareBtn.addEventListener('click', async () => {
          const url = window.location.href;
          if (navigator.share) {
            try {
              await navigator.share({ title: document.title, url });
              return;
            } catch (e) {}
          }
          if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(url).then(() => showToast('Link Bio berhasil disalin!'));
          } else {
            showToast(url);
          }
        });
      }

      fetch('/api/bio-links')
        .then(r => r.json())
        .then(res => {
          renderBioPage((res && res.data) || res || {});
        })
        .catch(() => {
          renderBioPage({
            profile: {
              name: 'KitaKerja · LOKERSMASMK',
              subtitle: 'Portal Lowongan Kerja Resmi Terverifikasi'
            },
            links: [
              { id: 'fallback_1', title: 'Web Kita LOKERSMASMK', subtitle: 'kitakerja.biz.id', url: '/', icon: 'globe', active: true }
            ]
          });
        });
    })();
  </script>
</body>

</html>

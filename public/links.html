    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100dvh;
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg-page);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      padding: 20px 16px 48px;
      -webkit-font-smoothing: antialiased;
      position: relative;
      overflow-x: clip;
    }

    body.bio-paused * {
      animation-play-state: paused !important;
    }

    /* ============================================================
       ULTRA-LIGHTWEIGHT GPU-ONLY ANIMATED BACKDROP (ZERO BLUR LAG)
       ============================================================ */
    .bio-bg-stage {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
      contain: strict;
    }

    .fx-layer {
      position: absolute;
      inset: 0;
      display: none;
    }

    body[data-bg-effect="aurora"] .fx-aurora,
    body[data-bg-effect="waves"] .fx-waves,
    body[data-bg-effect="stars"] .fx-stars,
    body[data-bg-effect="bubbles"] .fx-bubbles,
    body[data-bg-effect="grid"] .fx-grid {
      display: block;
    }

    /* Pre-softened radial-gradient orbs: silky glow at ~10x lower GPU cost than filter:blur() */
    .bio-orb {
      position: absolute;
      border-radius: 50%;
      will-change: transform;
      transform: translate3d(0, 0, 0);
    }
    .bio-orb-1 {
      width: 440px; height: 440px; top: -150px; left: -130px;
      background: radial-gradient(circle, var(--orb-1) 0%, transparent 68%);
      animation: bioOrbDrift1 15s ease-in-out infinite;
    }
    .bio-orb-2 {
      width: 460px; height: 460px; top: 24%; right: -160px;
      background: radial-gradient(circle, var(--orb-2) 0%, transparent 68%);
      animation: bioOrbDrift2 19s ease-in-out infinite;
    }
    .bio-orb-3 {
      width: 420px; height: 420px; bottom: -140px; left: 8%;
      background: radial-gradient(circle, var(--orb-3) 0%, transparent 68%);
      animation: bioOrbDrift3 17s ease-in-out infinite;
    }

    .bio-dot-grid {
      position: absolute; inset: -32px;
      background-image: radial-gradient(var(--grid-color) 1.5px, transparent 1.5px);
      background-size: 30px 30px;
      animation: bioGridFloat 24s linear infinite;
      will-change: transform;
    }
    .bio-ring-deco {
      position: absolute; width: 420px; height: 420px; top: -145px; left: 50%;
      border-radius: 50%; border: 1.5px dashed rgba(255, 255, 255, 0.24);
      animation: bioSpinSlow 46s linear infinite;
      will-change: transform;
    }

    .bio-wave-svg { position: absolute; bottom: -8px; left: 0; width: 200%; height: 195px; will-change: transform; }
    .bio-wave-svg.wave-back { fill: var(--wave-2); animation: bioWaveSlide 15s linear infinite; bottom: 8px; }
    .bio-wave-svg.wave-front { fill: var(--wave-1); animation: bioWaveSlideRev 11s linear infinite; }

    .bio-star {
      position: absolute; border-radius: 50%; background: var(--particle-color);
      animation: bioTwinkle var(--dur, 4s) ease-in-out var(--delay, 0s) infinite;
      will-change: transform, opacity;
    }
    .bio-meteor {
      position: absolute; width: 100px; height: 2px; border-radius: 999px;
      background: linear-gradient(90deg, var(--particle-color), transparent);
      transform: rotate(-32deg); opacity: 0;
      animation: bioMeteorShoot var(--dur, 7.5s) linear var(--delay, 0s) infinite;
      will-change: transform, opacity;
    }

    .bio-bubble {
      position: absolute; bottom: -56px; border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, rgba(255, 255, 255, 0.72), var(--orb-1) 70%);
      border: 1px solid rgba(255, 255, 255, 0.35); opacity: 0;
      animation: bioParticleRise var(--dur, 13s) linear var(--delay, 0s) infinite;
      will-change: transform, opacity;
    }

    .bio-cyber-lines {
      position: absolute; inset: -48px;
      background-image:
        linear-gradient(to right, var(--grid-color) 1px, transparent 1px),
        linear-gradient(to bottom, var(--grid-color) 1px, transparent 1px);
      background-size: 44px 44px;
      animation: bioGridFloat 20s linear infinite;
      will-change: transform;
    }
    .bio-cyber-pulse {
      position: absolute; width: 320px; height: 320px; top: 50%; left: 50%;
      border-radius: 50%; border: 1.5px solid var(--grid-color);
      animation: bioRingExpand 8.5s ease-out infinite;
      will-change: transform, opacity;
    }
    .bio-cyber-pulse.p2 { animation-delay: -4.25s; }

    .bio-particle {
      position: absolute; bottom: -20px; border-radius: 50%; background: var(--particle-color);
      opacity: 0; will-change: transform, opacity;
      animation: bioParticleRise var(--dur, 11s) linear var(--delay, 0s) infinite;
    }

    @keyframes bioGridFloat { 0% { transform: translate3d(0, 0, 0); } 100% { transform: translate3d(30px, 30px, 0); } }
    @keyframes bioOrbDrift1 { 0%, 100% { transform: translate3d(0, 0, 0) scale(1); } 50% { transform: translate3d(55px, 50px, 0) scale(1.1); } }
    @keyframes bioOrbDrift2 { 0%, 100% { transform: translate3d(0, 0, 0) scale(1); } 50% { transform: translate3d(-65px, -40px, 0) scale(1.1); } }
    @keyframes bioOrbDrift3 { 0%, 100% { transform: translate3d(0, 0, 0) scale(1); } 50% { transform: translate3d(60px, -50px, 0) scale(1.12); } }
    @keyframes bioSpinSlow { from { transform: translate3d(-50%, 0, 0) rotate(0deg); } to { transform: translate3d(-50%, 0, 0) rotate(360deg); } }
    @keyframes bioAvatarHalo { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    @keyframes bioWaveSlide { from { transform: translate3d(0, 0, 0); } to { transform: translate3d(-50%, 0, 0); } }
    @keyframes bioWaveSlideRev { from { transform: translate3d(-50%, 0, 0); } to { transform: translate3d(0, 0, 0); } }
    @keyframes bioTwinkle { 0%, 100% { opacity: 0.25; transform: scale(0.85); } 50% { opacity: 0.95; transform: scale(1.2); } }
    @keyframes bioMeteorShoot {
      0% { transform: translate3d(0, 0, 0) rotate(-32deg); opacity: 0; }
      7% { opacity: 0.95; }
      26% { transform: translate3d(-340px, 220px, 0) rotate(-32deg); opacity: 0; }
      100% { transform: translate3d(-340px, 220px, 0) rotate(-32deg); opacity: 0; }
    }
    @keyframes bioRingExpand {
      0% { transform: translate3d(-50%, -50%, 0) scale(0.45); opacity: 0.6; }
      100% { transform: translate3d(-50%, -50%, 0) scale(2); opacity: 0; }
    }
    @keyframes bioParticleRise {
      0% { transform: translate3d(0, 0, 0) scale(0.7); opacity: 0; }
      14% { opacity: 0.72; }
      84% { opacity: 0.5; }
      100% { transform: translate3d(var(--drift, 22px), -106vh, 0) scale(1.1); opacity: 0; }
    }
    @keyframes bioCardEnter {
      from { opacity: 0; transform: translate3d(0, 10px, 0); }
      to { opacity: 1; transform: translate3d(0, 0, 0); }
    }

    /* ============================================================

    .ic { width: 1em; height: 1em; display: inline-block; vertical-align: -0.14em; fill: currentColor; flex-shrink: 0; }
    .ic-stroke { fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

      color: var(--text-main);
      transition: transform 0.18s ease, box-shadow 0.18s ease, border-color 0.18s ease;
      position: relative;
      overflow: hidden;
      animation: bioCardEnter 0.35s ease both;
      animation-delay: calc(var(--card-idx, 0) * 45ms);
    }

    @media (min-width: 641px) {
      .bio-link-card, .bio-top-pill, .bio-social-btn {
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
      }

    body[data-card-style="solid"] .bio-link-card {
      background: #ffffff; border: 1.5px solid rgba(15, 23, 42, 0.1); color: #0f172a;

    body[data-card-style="outline"] .bio-link-card {
      background: rgba(15, 23, 42, 0.18); border: 2px solid var(--pill-border); color: var(--header-text);
    }
    body[data-card-style="outline"] .bio-link-title { color: var(--header-text); }
    body[data-card-style="outline"] .bio-link-sub { color: var(--header-sub); }

    body[data-card-style="pill"] .bio-link-card { border-radius: 999px; padding: 10px 16px 10px 10px; }
    body[data-card-style="pill"] .bio-link-thumb { border-radius: 50%; }

    .bio-link-card:hover { transform: translateY(-2px); box-shadow: var(--card-hover-shadow); border-color: var(--accent); }
    .bio-link-card:active { transform: scale(0.985); }

    .bio-link-thumb.tone-link { background: linear-gradient(135deg, #f8fafc, #e2e8f0); color: #334155; }

    .bio-link-body { flex: 1; min-width: 0; }
    .bio-link-title-row { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
    .bio-link-title {

    @media (max-width: 420px) {

  <script>
    (function () {
      const CACHE_KEY = 'kitakerja_bio_links_cache_v1';

      // Lightweight inline SVGs (0 KB external icon font network requests)
      const SVG_ICONS = {
        briefcase: '<svg class="ic ic-stroke" viewBox="0 0 24 24"><rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 7V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v2"/></svg>',

        'file-cv': '<svg class="ic ic-stroke" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>',
        instagram: '<svg class="ic ic-stroke" viewBox="0 0 24 24"><rect x="2" y="2" width="20" height="20" rx="5"/><path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"/><line x1="17.5" y1="6.5" x2="17.51" y2="6.5"/></svg>',
        tiktok: '<svg class="ic" viewBox="0 0 24 24"><path d="M19.59 6.69a4.83 4.83 0 0 1-3.77-4.25V2h-3.45v13.67a2.89 2.89 0 0 1-2.88 2.5 2.89 2.89 0 0 1-2.89-2.89 2.89 2.89 0 0 1 2.89-2.89c.28 0 .54.04.79.1V8.94a6.33 6.33 0 0 0-.79-.05A6.34 6.34 0 0 0 3.15 15.2a6.34 6.34 0 0 0 10.86 4.46 6.3 6.3 0 0 0 1.81-4.42V8.7a8.16 8.16 0 0 0 4.77 1.52V6.78a4.85 4.85 0 0 1-1-.09z"/></svg>',
        telegram: '<svg class="ic ic-stroke" viewBox="0 0 24 24"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>',
        envelope: '<svg class="ic ic-stroke" viewBox="0 0 24 24"><rect x="2" y="4" width="20" height="16" rx="2"/><polyline points="22,6 12,13 2,6"/></svg>',
        link: '<svg class="ic ic-stroke" viewBox="0 0 24 24"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>',
        chevron: '<svg class="ic ic-stroke" viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"/></svg>',
        shield: '<svg class="ic ic-stroke" viewBox="0 0 24 24"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><polyline points="9 12 11 14 15 10"/></svg>'
      };

      const THEME_DEFAULT_EFFECT = {
        clean: 'aurora', ocean: 'waves', emerald: 'grid', sunset: 'bubbles',
        midnight: 'stars', royal: 'stars', sakura: 'bubbles', cyberpunk: 'grid', custom: 'aurora'
      };

      const yearEl = document.getElementById('bio-year');
      if (yearEl) yearEl.textContent = String(new Date().getFullYear());

      // Auto-pause animations when tab is hidden to save battery & CPU
      document.addEventListener('visibilitychange', () => {
        document.body.classList.toggle('bio-paused', document.hidden);
      });

      function esc(str) {
        return String(str || '')
          .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
      }

      function hexToRgb(hex) {
        const clean = String(hex || '').replace('#', '');
        if (clean.length !== 6) return { r: 37, g: 99, b: 235 };
        return {
          r: parseInt(clean.slice(0, 2), 16) || 0,
          g: parseInt(clean.slice(2, 4), 16) || 0,
          b: parseInt(clean.slice(4, 6), 16) || 0
        };
      }
      function hexLuminance(hex) {
        const { r, g, b } = hexToRgb(hex);
        return (0.299 * r + 0.587 * g + 0.114 * b) / 255;
      }
      function hexRgba(hex, alpha) {
        const { r, g, b } = hexToRgb(hex);
        return `rgba(${r}, ${g}, ${b}, ${alpha})`;
      }

      function getDomainLabel(url) {
        try {
          return new URL(url, window.location.origin).hostname.replace(/^www\./, '');
        } catch {
          return String(url || '').replace(/^https?:\/\//i, '').split('/')[0] || '';
        }
      }

      function showToast(msg) {
        const el = document.getElementById('bio-toast');
        if (!el) return;
        el.textContent = msg;
        el.classList.add('show');
        clearTimeout(el._t);
        el._t = setTimeout(() => el.classList.remove('show'), 2200);
      }

      function trackClick(linkId) {
        if (!linkId) return;
        const endpoint = `/api/bio-links/${encodeURIComponent(linkId)}/click`;
        try {
          if (navigator.sendBeacon) {
            navigator.sendBeacon(endpoint, new Blob(['{}'], { type: 'application/json' }));
            return;
          }
        } catch (e) {}
        fetch(endpoint, { method: 'POST', keepalive: true }).catch(() => {});
      }

      function applyThemeAndEffects(profile) {
        const theme = profile.theme || 'clean';
        const rawEffect = profile.bg_effect || 'auto';
        const resolvedEffect = (rawEffect === 'auto' || !rawEffect)
          ? (THEME_DEFAULT_EFFECT[theme] || 'aurora')
          : rawEffect;
        const cardStyle = profile.card_style || 'glass';

        document.body.setAttribute('data-bio-theme', theme);
        document.body.setAttribute('data-bg-effect', resolvedEffect);
        document.body.setAttribute('data-card-style', cardStyle);

        if (theme === 'custom') {
          const c1 = /^#[0-9a-fA-F]{6}$/.test(profile.custom_c1 || '') ? profile.custom_c1 : '#2563eb';
          const c2 = /^#[0-9a-fA-F]{6}$/.test(profile.custom_c2 || '') ? profile.custom_c2 : '#7c3aed';
          const c3 = /^#[0-9a-fA-F]{6}$/.test(profile.custom_c3 || '') ? profile.custom_c3 : '#06b6d4';
          const avgLum = (hexLuminance(c1) + hexLuminance(c2) + hexLuminance(c3)) / 3;
          const mode = profile.custom_text_mode && profile.custom_text_mode !== 'auto'
            ? profile.custom_text_mode
            : (avgLum < 0.56 ? 'light' : 'dark');
          document.body.setAttribute('data-text-mode', mode);
          document.body.style.setProperty('--bg-page', `linear-gradient(135deg, ${c1} 0%, ${c2} 50%, ${c3} 100%)`);
          document.body.style.setProperty('--orb-1', hexRgba(c1, 0.42));
          document.body.style.setProperty('--orb-2', hexRgba(c2, 0.42));
          document.body.style.setProperty('--orb-3', hexRgba(c3, 0.38));
          document.body.style.setProperty('--accent', c1);
          document.body.style.setProperty('--accent-2', c2);
          document.body.style.setProperty('--accent-soft', hexRgba(c1, 0.14));
          document.body.style.setProperty('--wave-1', mode === 'light' ? 'rgba(255,255,255,0.16)' : hexRgba(c1, 0.16));
          document.body.style.setProperty('--wave-2', mode === 'light' ? 'rgba(255,255,255,0.12)' : hexRgba(c2, 0.14));
        } else {
          document.body.removeAttribute('data-text-mode');
          ['--bg-page', '--orb-1', '--orb-2', '--orb-3', '--accent', '--accent-2', '--accent-soft', '--wave-1', '--wave-2'].forEach(v => {
            document.body.style.removeProperty(v);
          });
        }
      }

      let lastRenderedSig = '';
      function renderBioPage(data) {
        if (!data) return;
        const sig = JSON.stringify(data);
        if (sig === lastRenderedSig) return;
        lastRenderedSig = sig;

        const profile = data.profile || {};
        const links = Array.isArray(data.links) ? data.links.filter(l => l && l.active !== false && l.url) : [];

        applyThemeAndEffects(profile);

        if (profile.name) {
          document.title = `${profile.name} · Link Resmi`;
          document.getElementById('bio-name').textContent = profile.name;
        }
        document.getElementById('bio-subtitle').textContent = profile.subtitle || '';

        const badgeEl = document.getElementById('bio-badge');
        if (badgeEl) {
          if (profile.badge) {
            badgeEl.innerHTML = `${SVG_ICONS.shield} ${esc(profile.badge)}`;
            badgeEl.style.display = 'inline-flex';
          } else {
            badgeEl.style.display = 'none';
          }
        }

        const avatarEl = document.getElementById('bio-avatar');
        if (avatarEl) {
          avatarEl.innerHTML = profile.avatar
            ? `<img src="${esc(profile.avatar)}" alt="${esc(profile.name || 'Profil')}" decoding="async">`
            : SVG_ICONS.briefcase;
        }

        const listEl = document.getElementById('bio-links-list');
        if (!links.length) {
          listEl.innerHTML = '<div style="text-align:center;color:var(--header-sub);padding:24px;font-size:0.88rem;">Belum ada tautan aktif.</div>';
        } else {
          listEl.innerHTML = links.map((item, idx) => {
            const iconKey = SVG_ICONS[item.icon] ? item.icon : 'link';
            const thumbHtml = item.thumbnail
              ? `<img src="${esc(item.thumbnail)}" alt="${esc(item.title)}" loading="${idx < 4 ? 'eager' : 'lazy'}" decoding="async">`
              : SVG_ICONS[iconKey];
            const subText = item.subtitle ? item.subtitle : getDomainLabel(item.url);
            return `
              <a class="bio-link-card" style="--card-idx: ${idx};" href="${esc(item.url)}" target="_blank" rel="noopener noreferrer" data-link-id="${esc(item.id)}">
                <div class="bio-link-thumb tone-${esc(iconKey)}">${thumbHtml}</div>
                <div class="bio-link-body">
                  <div class="bio-link-title-row">
                    <span class="bio-link-title">${esc(item.title)}</span>
                    ${item.badge ? `<span class="bio-link-badge">${esc(item.badge)}</span>` : ''}
                  </div>
                  <div class="bio-link-sub">${esc(subText)}</div>
                </div>
                <div class="bio-link-arrow">${SVG_ICONS.chevron}</div>
              </a>
            `;
          }).join('');

          listEl.querySelectorAll('.bio-link-card').forEach(card => {
            card.addEventListener('click', () => {
              trackClick(card.getAttribute('data-link-id'));
            });
          });
        }

        const socialsEl = document.getElementById('bio-socials');
        const socialItems = [];
        if (profile.instagram_url) {
          const igUrl = /^https?:\/\//i.test(profile.instagram_url) ? profile.instagram_url : `https://${profile.instagram_url}`;
          socialItems.push(`<a class="bio-social-btn ig" href="${esc(igUrl)}" target="_blank" rel="noopener noreferrer">${SVG_ICONS.instagram} Instagram</a>`);
        }
        if (profile.tiktok_url) {
          const ttUrl = /^https?:\/\//i.test(profile.tiktok_url) ? profile.tiktok_url : `https://${profile.tiktok_url}`;
          socialItems.push(`<a class="bio-social-btn tt" href="${esc(ttUrl)}" target="_blank" rel="noopener noreferrer">${SVG_ICONS.tiktok} TikTok</a>`);
        }
        if (socialItems.length > 0) {
          socialsEl.innerHTML = socialItems.join('');
          socialsEl.style.display = 'flex';
        } else {
          socialsEl.style.display = 'none';
        }
      }

      const shareBtn = document.getElementById('btn-share-bio');
      if (shareBtn) {
        shareBtn.addEventListener('click', async () => {
          const url = window.location.href;
          if (navigator.share) {
            try { await navigator.share({ title: document.title, url }); return; } catch (e) {}
          }
          if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(url).then(() => showToast('Link Bio berhasil disalin!'));
          } else {
            showToast(url);
          }
        });
      }

      // 1. Instant 0ms render from localStorage cache (SWR)
      let hadCache = false;
      try {
        const cached = localStorage.getItem(CACHE_KEY);
        if (cached) {
          const parsed = JSON.parse(cached);
          if (parsed && parsed.profile) {
            renderBioPage(parsed);
            hadCache = true;
          }
        }
      } catch (e) {}

      // 2. Revalidate silently from Edge-cached API
      fetch('/api/bio-links')
        .then(r => r.json())
        .then(res => {
          const fresh = (res && res.data) || res || null;
          if (fresh && fresh.profile) {
            try { localStorage.setItem(CACHE_KEY, JSON.stringify(fresh)); } catch (e) {}
            renderBioPage(fresh);
          }
        })
        .catch(() => {
          if (!hadCache) {
            renderBioPage({
              profile: { name: 'KitaKerja · LOKERSMASMK', subtitle: 'Portal Lowongan Kerja Resmi Terverifikasi' },
              links: [{ id: 'fallback_1', title: 'Web Kita LOKERSMASMK', subtitle: 'kitakerja.biz.id', url: '/', icon: 'globe', active: true }]
            });
          }
        });
    })();
  </script>
</body>

</html>
